*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
#app{min-height:100vh;}

.disp{font-family:'Space Grotesk',sans-serif;}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;}

.btn-primary{background:var(--cyan);color:#04201C;}
.btn-outline{background:transparent;color:var(--text);border-color:var(--line);}
.btn-danger{background:transparent;color:var(--red);border-color:#F0554A66;}
.btn-ghost{background:transparent;color:var(--muted);}
.btn-sm{padding:6px 12px;font-size:12.5px;}
.input,select.input,textarea.input{
  font-family:'Inter',sans-serif;background:var(--panel2);border:1px solid var(--line);color:var(--text);

}
.pwrow{display:flex;gap:6px;align-items:center;}

.wrap{flex-wrap:wrap;}
.between{justify-content:space-between;}
.center{align-items:center;}

.optbtn{font-family:'Inter',sans-serif;text-align:left;font-size:14px;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;width:100%;display:flex;align-items:center;gap:10px;}

.chk{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--muted);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.chk.on{background:var(--cyan);border-color:var(--cyan);}
.typebtn{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;}
.typebtn.active{border-color:var(--cyanDim);background:#5EEAD414;color:var(--cyan);}
.tabbtn{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;}

.qgrid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:6px;align-items:center;}
.tblrow{display:grid;padding:12px 14px;border-bottom:1px solid var(--lineSoft);align-items:center;}

.iconbtn{background:none;border:none;color:var(--red);cursor:pointer;padding:6px;}
.center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.grid-bar{height:5px;background:var(--lineSoft);border-radius:3px;overflow:hidden;}
.grid-bar > div{height:100%;transition:width 1s linear;}

<body>
<div id="app"></div>

<script>
/* =========================================================================
   PLATAFORMA PARA EVALUACIONES PARCIALES — Universidad Regional
   Versión 100% en el navegador (sin servidor ni base de datos externa).
   Se publica como un solo archivo HTML en cualquier hosting y ya queda
   "en línea": cualquier estudiante con el enlace puede presentar el examen
   desde su propio dispositivo.

   Como no hay base de datos compartida, cada resultado se guarda en el
   navegador del estudiante y además se descarga automáticamente un archivo
   .json al terminar. El docente reúne esos archivos (o le pide a cada
   estudiante que se lo envíe) y los importa en "Reporte de resultados" para
   consolidarlos y exportarlos a Excel. Al importar, los carnés duplicados
   para la misma evaluación se descartan automáticamente.
========================================================================= */

const DEFAULT_JORNADAS = ["Matutina","Vespertina","Nocturna","Sabatina"];
const TYPE_LABEL = {
  numeric:"Respuesta numérica",
  boolean:"Verdadero / Falso",
  multiple:"Opción múltiple (una respuesta)",
  checklist:"Checklist (varias respuestas)",
  short:"Respuesta concreta"
};

/* ---------- storage (localStorage del navegador) ---------- */
function loadConfig(){
  try{ const c = JSON.parse(localStorage.getItem('bp_config_v3')); if(c) return c; }catch{}
  const def = { institutionName:"Universidad Regional", password:"docente2026" };
  localStorage.setItem('bp_config_v3', JSON.stringify(def));
  return def;
}
function saveConfig(c){ localStorage.setItem('bp_config_v3', JSON.stringify(c)); }
function loadExams(){ try{ return JSON.parse(localStorage.getItem('bp_exams_v2')) || []; }catch{ return []; } }
function saveExams(e){ localStorage.setItem('bp_exams_v2', JSON.stringify(e)); }
function loadResults(){ try{ return JSON.parse(localStorage.getItem('bp_results_v3')) || []; }catch{ return []; } }
function saveResults(r){ localStorage.setItem('bp_results_v3', JSON.stringify(r)); }

/* ---------- helpers ---------- */
function genId(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function fmtTime(sec){ sec = Math.max(0,sec); const m = Math.floor(sec/60), s = sec%60; return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
function shuffle(arr){ return [...arr].sort(()=>Math.random()-0.5); }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function normText(s){ return (s||'').toString().trim().toLowerCase(); }
function sameSet(a,b){ if(a.length!==b.length) return false; const sa=[...a].sort(), sb=[...b].sort(); return sa.every((v,i)=>v===sb[i]); }
function slug(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }

function randomizeVariables(vars){
  const scope = {}, display = {};
  (vars||[]).forEach(v=>{
    const dec = Number.isFinite(v.decimals) ? v.decimals : 0;
    const raw = Math.random()*(v.max-v.min)+v.min;
    const val = parseFloat(raw.toFixed(dec));
    scope[v.name] = val;
    display[v.name] = dec>0 ? val.toFixed(dec) : String(val);
  });
  return { scope, display };
}
function fillTemplate(tpl, display){
  return (tpl||'').replace(/\{(\w+)\}/g, (m,name)=> display[name]!==undefined ? display[name] : m);
}
function computeAnswer(formula, scope){
  try{
    const keys = Object.keys(scope);
    const vals = keys.map(k=>scope[k]);
    const expr = (formula||'').replace(/\^/g,'**');
    const fn = new Function(...keys, `"use strict"; return (${expr});`);
    const val = fn(...vals);
    return (typeof val === 'number' && isFinite(val)) ? val : NaN;
  }catch{ return NaN; }
}
function isNumericCorrect(userVal, correctVal, tolerancePct){
  if(!Number.isFinite(userVal) || !Number.isFinite(correctVal)) return false;
  const tol = Number.isFinite(tolerancePct) ? tolerancePct : 1;
  const allowed = Math.max(Math.abs(correctVal)*(tol/100), 1e-9);
  return Math.abs(userVal-correctVal) <= allowed;
}
function instantiateQuestion(q){
  const base = { qid:q.id, title:q.title, type:q.type, timeLimit:q.timeLimit||90 };
  if(q.type==='numeric'){
    const { scope, display } = randomizeVariables(q.variables);
    return { ...base, text:fillTemplate(q.statement, display), unit:q.unit, tolerance:q.tolerance, correct:computeAnswer(q.formula, scope) };
  }
  if(q.type==='boolean') return { ...base, text:q.statement, correctBool:!!q.correctBool };
  if(q.type==='multiple') return { ...base, text:q.statement, options:shuffle(q.options), correctOptionId:q.correctOptionId };
  if(q.type==='checklist') return { ...base, text:q.statement, options:shuffle(q.options), correctOptionIds:q.correctOptionIds||[] };
  return { ...base, text:q.statement, acceptedAnswers:q.acceptedAnswers||[] };
}
function evaluateAnswer(q, userAnswer){
  if(userAnswer===null || userAnswer===undefined || userAnswer==='') return false;
  if(q.type==='numeric') return isNumericCorrect(parseFloat(userAnswer), q.correct, q.tolerance);
  if(q.type==='boolean') return userAnswer===q.correctBool;
  if(q.type==='multiple') return userAnswer===q.correctOptionId;
  if(q.type==='checklist') return Array.isArray(userAnswer) && userAnswer.length>0 && sameSet(userAnswer, q.correctOptionIds);
  if(q.type==='short') return q.acceptedAnswers.some(a=>normText(a)===normText(userAnswer));
  return false;
}

/* ---------- global state ---------- */
let S = {
  screen: 'landing',
  authed: false,
  authError: '',
  config: loadConfig(),
  exams: loadExams(),
  results: loadResults(),
  currentExamId: null,
  instructorTab: 'bank',
  jornadaFilter: 'Todas',
  showQForm: false,
  qFormType: 'numeric',
  formVars: [ { id:genId(), name:'', min:1, max:10, decimals:0 } ],
  formOptions: [ { id:genId(), text:'' }, { id:genId(), text:'' } ],
  formCorrectOptionId: null,
  formCorrectOptionIds: [],
  formCorrectBool: true,
  formError: '',
  qPreview: null,
  showNewExam: false,
  pwError: '', pwSuccess: '',
  regError: '',
  editingQuestionId: null,
  showSettings: false,
};

let examSession = null;
let timerInterval = null;
let tabListenersAttached = false;

const app = document.getElementById('app');
function render(){ app.innerHTML = views[S.screen](); }
function currentExam(){ return S.exams.find(e=>e.id===S.currentExamId) || null; }
function persistExams(){ saveExams(S.exams); }

/* =========================================================================
   ICONS
========================================================================= */
const ic = {
  radio:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"/></svg>`,
  lock:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`,
  shield:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg>`,
  trash:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>`,
  ban:`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></svg>`,
  check:`<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>`,
  x:`<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>`,
  checksm:`<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#04201C" stroke-width="3"><path d="m20 6-11 11-5-5"/></svg>`,
  eye:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>`,
  eyeoff:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.6 19.6 0 0 1 5.06-5.94M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a19.6 19.6 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>`,
};
function icon(name){
  if(name==='settings') return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`;
  if(name==='cap') return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 10-10-5L2 10l10 5 10-5Z"/><path d="M6 12v5c0 1.1 2.7 3 6 3s6-1.9 6-3v-5"/></svg>`;
  if(name==='back') return `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5m0 0 7 7m-7-7 7-7"/></svg>`;
  if(name==='plus') return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>`;
  if(name==='chev') return `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>`;
  if(name==='book') return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`;
  return '';
}
function pwToggleBtn(inputId){
  return `<button type="button" class="btn btn-outline btn-sm" style="padding:9px 10px;" onclick="togglePw('${inputId}', this)">${ic.eye}</button>`;
}
function togglePw(id, btn){
  const el = document.getElementById(id);
  if(!el) return;
  const show = el.type === 'password';
  el.type = show ? 'text' : 'password';
  btn.innerHTML = show ? ic.eyeoff : ic.eye;
}

/* =========================================================================
   VIEWS
========================================================================= */
const views = {};

views.instructor = () => `

        ${S.exams.map(ex=>`

function examResultsTabHtml(ex){
  const jornadas = ['Todas', ...(ex.jornadas||DEFAULT_JORNADAS)];
  const scoped = S.results.filter(r=>r.examId===ex.id);
  const list = S.jornadaFilter==='Todas' ? scoped : scoped.filter(r=>r.jornada===S.jornadaFilter);
  const avg = list.length ? (list.reduce((s,r)=>s+r.score,0)/list.length).toFixed(1) : '—';
  return `
    <div class="row between center wrap" style="margin-bottom:14px;gap:10px;">
      <div class="row wrap center" style="gap:8px;">
        <span class="pill pill-cyan">${list.length} entrega${list.length===1?'':'s'}</span>

      </div>
      <div class="row center" style="gap:8px;flex-wrap:wrap;">
        <select class="input" style="width:170px;" onchange="setJornadaFilter(this.value)">
          ${jornadas.map(j=>`<option value="${escapeHtml(j)}" ${S.jornadaFilter===j?'selected':''}>${escapeHtml(j)}</option>`).join('')}
        </select>
        <label class="btn btn-outline" style="margin:0;">

          <input type="file" accept="application/json" multiple style="display:none;" onchange="importResults(this.files)">
        </label>
        <button class="btn btn-outline" onclick="exportXlsx('${ex.id}')">Exportar a Excel</button>
      </div>
    </div>
    ${resultsTableHtml(list)}
  `;
}

function resultsTableHtml(list, showExamCol){
  const cols = showExamCol ? '1.2fr 1fr 0.9fr 0.8fr 0.9fr 1fr' : '1.2fr 0.9fr 0.9fr 0.8fr 0.9fr 1fr';
  return `
    <div class="panel" style="overflow:hidden;">
      <div class="tblhead" style="grid-template-columns:${cols};">
        <div>ESTUDIANTE</div>${showExamCol?'<div>EVALUACIÓN</div>':''}<div>JORNADA</div><div>%</div><div>PESTAÑAS</div><div>FECHA</div>
      </div>
      ${list.map(r=>`
        <div class="tblrow" style="grid-template-columns:${cols};">
          <div style="font-size:13.5px;">
            ${escapeHtml(r.studentName)}
            <span class="mono" style="color:var(--mutedDim);font-size:11px;display:block;">${r.carne?escapeHtml(r.carne):''}</span>
            ${r.disqualified ? '<span class="pill pill-red" style="margin-top:4px;">Anulado</span>' : ''}
          </div>
          ${showExamCol ? `<div style="font-size:13px;color:var(--muted);">${escapeHtml(r.examName||'—')}</div>` : ''}
          <div style="font-size:13px;color:var(--muted);">${escapeHtml(r.jornada||'—')}</div>
          <div class="mono" style="font-weight:700;font-size:15px;color:${r.score>=60?'var(--cyan)':'var(--red)'};">${r.score.toFixed(0)}%</div>
          <div class="mono" style="font-size:13px;color:${r.tabSwitches>0?'var(--red)':'var(--mutedDim)'};">${r.tabSwitches}</div>
          <div style="display:flex;flex-direction:column;gap:4px;">
            <span class="mono" style="font-size:10.5px;color:var(--mutedDim);">${new Date(r.submittedAt).toLocaleString()}</span>
            <button class="btn btn-ghost btn-sm" style="padding:2px 0;justify-content:flex-start;color:var(--red);" onclick="removeResult('${r.id}')">Eliminar</button>
          </div>
        </div>
      `).join('')}
      ${list.length===0 ? `<div style="color:var(--mutedDim);font-size:13px;text-align:center;padding:30px;">Todavía no hay entregas. Pide a los estudiantes su archivo de resultado (.json) y usa "Importar".</div>` : ''}
    </div>
  `;
}

function openQForm(editId){
  const ex = currentExam();
  const existing = editId && ex ? (ex.bank||[]).find(q=>q.id===editId) : null;

  S.showQForm=true; S.qPreview=null; S.formError='';
  S.editingQuestionId = existing ? existing.id : null;

  if(existing){
    S.qFormType = existing.type;
    S.formVars = existing.type==='numeric'
      ? existing.variables.map(v=>({id:genId(), name:v.name, min:v.min, max:v.max, decimals:v.decimals}))
      : [{id:genId(),name:'',min:1,max:10,decimals:0}];
    if(existing.type==='multiple' || existing.type==='checklist'){
      S.formOptions = existing.options.map(o=>({id:genId(), text:o.text}));
      if(existing.type==='multiple'){
        const correctIdx = existing.options.findIndex(o=>o.id===existing.correctOptionId);
        S.formCorrectOptionId = correctIdx>=0 ? S.formOptions[correctIdx].id : null;
        S.formCorrectOptionIds = [];
      } else {
        const correctIdxs = existing.options.map((o,i)=>existing.correctOptionIds.includes(o.id)?i:-1).filter(i=>i>=0);
        S.formCorrectOptionIds = correctIdxs.map(i=>S.formOptions[i].id);
        S.formCorrectOptionId = null;
      }
    } else {
      S.formOptions = [{id:genId(),text:''},{id:genId(),text:''}];
      S.formCorrectOptionId=null; S.formCorrectOptionIds=[];
    }
    S.formCorrectBool = existing.type==='boolean' ? !!existing.correctBool : true;
  } else {
    S.qFormType='numeric';
    S.formVars=[{id:genId(),name:'',min:1,max:10,decimals:0}];
    S.formOptions=[{id:genId(),text:''},{id:genId(),text:''}];
    S.formCorrectOptionId=null; S.formCorrectOptionIds=[]; S.formCorrectBool=true;
  }
  render();
  if(existing){
    const set = (id,val) => { const el=document.getElementById(id); if(el) el.value = val; };
    set('qTitle', existing.title);
    set('qStatement', existing.statement);
    set('qTimeLimit', existing.timeLimit);
    if(existing.type==='numeric'){ set('qFormula', existing.formula); set('qUnit', existing.unit); set('qTolerance', existing.tolerance); }
    if(existing.type==='short'){ set('qAccepted', (existing.acceptedAnswers||[]).join(', ')); }
  }
}

function readVarsFromForm(){
  return S.formVars.map(v=>({ id:v.id, name:(v.name||'').trim(), min:Number(v.min), max:Number(v.max), decimals:Number(v.decimals) }));

function previewQuestion(){
  S.formError='';
  const statement = document.getElementById('qStatement').value;
  const formula = document.getElementById('qFormula').value;
  const vars = readVarsFromForm();
  try{
    const { scope, display } = randomizeVariables(vars);
    const ans = computeAnswer(formula, scope);
    if(!Number.isFinite(ans)) throw new Error('La fórmula no produjo un número válido.');
    S.qPreview = { text: fillTemplate(statement, display), ans };
  }catch(e){
    S.formError = e.message || 'Error al evaluar la fórmula.';
    S.qPreview = null;
  }
  render();
}

function saveQuestion(){
  const ex = currentExam(); if(!ex) return;
  const type = S.qFormType;
  const title = document.getElementById('qTitle').value.trim();
  const statement = document.getElementById('qStatement').value.trim();
  const timeLimit = Number(document.getElementById('qTimeLimit').value);
  S.formError='';

  if(!title || !statement){ S.formError='Completa el título y el enunciado.'; render(); return; }

  const qId = S.editingQuestionId || genId();
  let q = { id:qId, type, title, statement, timeLimit: timeLimit || 60 };

  if(type==='numeric'){
    const formula = document.getElementById('qFormula').value.trim();
    const unit = document.getElementById('qUnit').value.trim();
    const tolerance = Number(document.getElementById('qTolerance').value);
    const vars = readVarsFromForm();
    if(!formula || vars.some(v=>!v.name)){ S.formError='Completa la fórmula y el nombre de cada variable.'; render(); return; }
    q = { ...q, variables:vars, formula, unit, tolerance: Number.isFinite(tolerance)?tolerance:1 };
  } else if(type==='boolean'){
    q = { ...q, correctBool: S.formCorrectBool };
  } else if(type==='multiple'){
    const valid = S.formOptions.filter(o=>o.text && o.text.trim());
    if(valid.length<2){ S.formError='Agrega al menos dos opciones con texto.'; render(); return; }
    if(!S.formCorrectOptionId || !valid.some(o=>o.id===S.formCorrectOptionId)){ S.formError='Selecciona cuál opción es la correcta.'; render(); return; }
    q = { ...q, options: valid.map(o=>({id:o.id,text:o.text.trim()})), correctOptionId: S.formCorrectOptionId };
  } else if(type==='checklist'){
    const valid = S.formOptions.filter(o=>o.text && o.text.trim());
    if(valid.length<2){ S.formError='Agrega al menos dos opciones con texto.'; render(); return; }
    const validIds = new Set(valid.map(o=>o.id));
    const correctIds = S.formCorrectOptionIds.filter(id=>validIds.has(id));
    if(correctIds.length===0){ S.formError='Marca al menos una opción como correcta.'; render(); return; }
    q = { ...q, options: valid.map(o=>({id:o.id,text:o.text.trim()})), correctOptionIds: correctIds };
  } else if(type==='short'){
    const raw = document.getElementById('qAccepted').value;
    const list = raw.split(',').map(s=>s.trim()).filter(Boolean);
    if(list.length===0){ S.formError='Escribe al menos una respuesta aceptada.'; render(); return; }
    q = { ...q, acceptedAnswers:list };
  }

  ex.bank = S.editingQuestionId
    ? (ex.bank||[]).map(item => item.id===qId ? q : item)
    : [...(ex.bank||[]), q];

  persistExams();
  S.showQForm=false;
  S.editingQuestionId=null;
  render();
}
function deleteQuestion(id){
  const ex = currentExam(); if(!ex) return;
  ex.bank = (ex.bank||[]).filter(q=>q.id!==id);
  persistExams(); render();
}

========================================================================= */
function setJornadaFilter(v){ S.jornadaFilter=v; render(); }
function removeResult(id){
  if(!confirm('¿Eliminar este resultado? Esto permitirá que ese carné vuelva a presentar la evaluación en este navegador.')) return;
  S.results = S.results.filter(r=>r.id!==id);
  saveResults(S.results);
  render();
}
function importResults(fileList){
  const files = Array.from(fileList||[]);
  let pending = files.length;
  if(!pending) return;
  let added = 0, skippedDup = 0;
  files.forEach(f=>{
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const data = JSON.parse(reader.result);
        if(data && data.examId){
          const carneKey = data.carneKey || normText(data.carne);
          const isDup = S.results.some(r=>r.examId===data.examId && (r.carneKey||normText(r.carne))===carneKey);
          const alreadyImported = S.results.some(r=>r.id===data.id);
          if(!alreadyImported && !isDup){ S.results.push(data); added++; }
          else if(isDup){ skippedDup++; }
        }
      }catch{}
      pending--;
      if(pending===0){
        saveResults(S.results);
        render();
        if(skippedDup>0) alert(`Se importaron ${added} resultado(s). Se descartaron ${skippedDup} por carné duplicado en la misma evaluación.`);
      }
    };
    reader.readAsText(f);
  });
}
function exportXlsx(examId){
  const source = examId ? S.results.filter(r=>r.examId===examId) : S.results;
  const rows = source.map(r=>({
    Evaluacion: r.examName||'',
    Estudiante: r.studentName,
    Carne: r.carne||'',
    Jornada: r.jornada||'',
    'Porcentaje (%)': Number(r.score.toFixed(1)),
    Correctas: r.correctCount,
    Total: r.total,
    'Cambios de pestaña': r.tabSwitches,
    Anulado: r.disqualified ? 'Sí' : 'No',
    Fecha: new Date(r.submittedAt).toLocaleString(),
  }));
  if(rows.length===0){ alert('No hay resultados para exportar todavía.'); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Resultados');
  XLSX.writeFile(wb, 'resultados_' + Date.now() + '.xlsx');
}

  const ex = currentExam(); if(!ex) return;
  const name = document.getElementById('stuName').value.trim();
  const carne = document.getElementById('stuCarne').value.trim();
  const jornada = document.getElementById('stuJornada').value;
  S.regError = '';
  if(!name){ S.regError='Escribe tu nombre completo.'; render(); return; }
  if(!carne){ S.regError='Escribe tu carné.'; render(); return; }

  const carneKey = normText(carne);
  const already = S.results.some(r=>r.examId===ex.id && (r.carneKey||normText(r.carne))===carneKey);
  if(already){
    S.regError = 'Este carné ya presentó esta evaluación en este dispositivo. Solo se permite un intento por carné.';
    render();
    return;
  }

  const n = Math.min(ex.questionsPerExam || 5, (ex.bank||[]).length);
  const chosen = shuffle(ex.bank||[]).slice(0, n);
  const questions = chosen.map(instantiateQuestion);
  examSession = {
    examId: ex.id, examName: ex.name, maxTabSwitches: ex.maxTabSwitches,
    studentName: name, carne, carneKey, jornada,
    questions, idx: 0, answers: [],
    tabSwitches: 0, pasteAttempts: 0,
    currentAnswer: null, checklistSelected: [], disqualified: false,
  };
  S.screen = 'student-exam';
  render();
  attachExamListeners();
  startQuestionTimer();
}

function onFreeAnswerInput(val){
  examSession.currentAnswer = val;
  document.getElementById('nextBtn').disabled = (val===null || val==='');
}
function chooseBoolean(val){
  examSession.currentAnswer = val;
  document.getElementById('optTrue').className = 'btn ' + (val===true ? 'btn-primary' : 'btn-outline');
  document.getElementById('optFalse').className = 'btn ' + (val===false ? 'btn-primary' : 'btn-outline');
  document.getElementById('optTrue').style.flex='1'; document.getElementById('optTrue').style.justifyContent='center';
  document.getElementById('optFalse').style.flex='1'; document.getElementById('optFalse').style.justifyContent='center';
  document.getElementById('nextBtn').disabled = false;
}
function chooseOption(id){
  examSession.currentAnswer = id;
  const q = examSession.questions[examSession.idx];
  q.options.forEach(o=>{
    const el = document.getElementById('opt_'+o.id);
    if(el) el.className = 'optbtn' + (o.id===id ? ' active' : '');
  });
  document.getElementById('nextBtn').disabled = false;
}
function toggleChecklistOption(id){
  const sel = examSession.checklistSelected;
  const i = sel.indexOf(id);
  if(i>=0) sel.splice(i,1); else sel.push(id);
  examSession.currentAnswer = [...sel];
  const btn = document.getElementById('opt_'+id);
  const chk = document.getElementById('chk_'+id);
  const on = sel.includes(id);
  if(btn) btn.className = 'optbtn' + (on ? ' active' : '');
  if(chk){ chk.className = 'chk' + (on ? ' on' : ''); chk.innerHTML = on ? ic.checksm : ''; }
  document.getElementById('nextBtn').disabled = sel.length===0;
}

function startQuestionTimer(){
  clearInterval(timerInterval);
  const q = examSession.questions[examSession.idx];
  let remaining = q.timeLimit;
  updateTimerUI(remaining, q.timeLimit);
  timerInterval = setInterval(()=>{
    remaining -= 1;
    if(remaining<=0){
      clearInterval(timerInterval);
      submitAnswer(true);
    } else {
      updateTimerUI(remaining, q.timeLimit);
    }
  }, 1000);
}
function updateTimerUI(remaining, total){
  const el = document.getElementById('timerText');
  const bar = document.getElementById('timerBar');
  if(!el || !bar) return;
  el.textContent = fmtTime(remaining);
  const pct = Math.max(0, (remaining/total)*100);
  bar.style.width = pct + '%';
  const tone = remaining<=10 ? 'var(--red)' : remaining<=30 ? 'var(--amber)' : 'var(--cyan)';
  el.style.color = tone;
  bar.style.background = tone;
}

function submitAnswer(auto){
  if(!examSession) return;
  clearInterval(timerInterval);
  const q = examSession.questions[examSession.idx];
  const correct = auto ? false : evaluateAnswer(q, examSession.currentAnswer);
  examSession.answers.push({ qid:q.qid, userAnswer: auto ? null : examSession.currentAnswer, correct, auto });
  examSession.currentAnswer = null;
  examSession.checklistSelected = [];
  if(examSession.idx+1 >= examSession.questions.length){
    finishExam(false, null);
  } else {
    examSession.idx += 1;
    render();
    startQuestionTimer();
  }
}

/* ---- anti-cheat: tab switching ---- */
function attachExamListeners(){
  if(tabListenersAttached) return;
  tabListenersAttached = true;
  document.addEventListener('visibilitychange', onVisChange);
  window.addEventListener('blur', onWindowBlur);
}
function stopExamListeners(){
  if(!tabListenersAttached) return;
  tabListenersAttached = false;
  document.removeEventListener('visibilitychange', onVisChange);
  window.removeEventListener('blur', onWindowBlur);
}
function onVisChange(){ if(document.hidden) flagTabSwitch(); }
function onWindowBlur(){ flagTabSwitch(); }
function flagTabSwitch(){
  if(!examSession || examSession.disqualified) return;
  examSession.tabSwitches += 1;
  const banner = document.getElementById('tabBanner');
  const counter = document.getElementById('switchCounter');
  const max = examSession.maxTabSwitches;
  if(banner){
    banner.innerHTML = `<div class="banner-red">${ic.shield} Cambio de pestaña/ventana detectado (${examSession.tabSwitches}/${max}). Al superar el límite el examen se cerrará automáticamente.</div>`;
    setTimeout(()=>{ if(banner) banner.innerHTML=''; }, 3500);
  }
  if(counter){
    const left = Math.max(0, max - examSession.tabSwitches);
    counter.textContent = left + ' CAMBIOS DISPONIBLES';
    counter.style.color = 'var(--red)';
  }
  if(examSession.tabSwitches > max){
    examSession.disqualified = true;
    clearInterval(timerInterval);
    const remainingBlank = examSession.questions.slice(examSession.idx).map(q=>({ qid:q.qid, userAnswer:null, correct:false, auto:true }));
    examSession.answers = [...examSession.answers, ...remainingBlank];
    finishExam(true, `Superó el límite de ${max} cambios de pestaña.`);
  }
}
function blockClipboard(e){
  if(examSession) examSession.pasteAttempts += 1;
  e.preventDefault();
  return false;
}

function finishExam(disqualified, reason){
  stopExamListeners();
  clearInterval(timerInterval);
  const scoreCount = examSession.answers.filter(a=>a.correct).length;
  const total = examSession.answers.length;
  const score = total ? (scoreCount/total)*100 : 0;
  const result = {
    id: genId(),
    examId: examSession.examId,
    examName: examSession.examName,
    studentName: examSession.studentName,
    carne: examSession.carne,
    carneKey: examSession.carneKey,
    jornada: examSession.jornada,
    score, total,
    correctCount: scoreCount,
    tabSwitches: examSession.tabSwitches,
    pasteAttempts: examSession.pasteAttempts,
    submittedAt: Date.now(),
    disqualified: !!disqualified,
    disqualifyReason: reason || null,
  };
  S.results.push(result);
  saveResults(S.results);
  downloadJson(result, `resultado_${slug(result.studentName)}_${result.submittedAt}.json`);
  S.lastResult = result;
  S.screen = 'student-result';
  examSession = null;
  render();
}
function downloadJson(obj, filename){
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

render();
</script>
